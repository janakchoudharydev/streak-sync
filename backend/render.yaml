services:
  - type: web
    name: streak-sync-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: streak-postgres
          property: connectionString

databases:
  - name: streak-postgres
    plan: free
    databaseName: streak
    user: streak
